name: Verify and build Windows portable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify restoration, updates and clean installation
        run: python -m unittest test_portability test_updater -v
      - name: Build archives without local game files
        run: python build_share.py
      - uses: actions/upload-artifact@v4
        with:
          name: DotaAtelier-Windows-x64
          path: |
            dist/DotaAtelier-Compartilhar.zip
            dist/DotaAtelier-Fonte.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
